<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>邀请你体验「扣子」- wuzhanqi.cn</title>
    <meta name="description" content="零门槛搭建 AI 助手 - Chatbot、工作流、RAG 都能搞">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #1a1d2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e8eaf6;
            padding: 20px 16px 40px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #252a3f 0%, #1e2235 100%);
            border-radius: 24px;
            padding: 36px 28px 32px;
            margin-top: 10%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
            animation: cardIn 0.7s ease-out;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 标签 */
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #ff7043, #ff5722);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 28px;
            animation: fadeInDown 0.5s ease 0.2s both;
        }

        .tag-icon {
            font-size: 15px;
        }

        /* 图标区域 */
        .icons-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
            animation: fadeInUp 0.5s ease 0.3s both;
        }

        .icon-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .icon-circle.left {
            background: linear-gradient(135deg, #7c4dff, #651fff);
            box-shadow: 0 4px 15px rgba(124,77,255,0.35);
        }

        .icon-circle.right {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            box-shadow: 0 4px 15px rgba(255,152,0,0.35);
        }

        .arrow-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b0bec5;
            font-size: 16px;
        }

        /* 主标题 */
        .main-title {
            text-align: center;
            margin-bottom: 10px;
            animation: fadeInUp 0.5s ease 0.4s both;
        }

        .main-title h1 {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.4;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #c5cae9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 副标题 */
        .subtitle {
            text-align: center;
            font-size: 14px;
            line-height: 1.8;
            color: #90a4ae;
            margin-bottom: 30px;
            animation: fadeInUp 0.5s ease 0.5s both;
        }

        /* 积分卡片 */
        .points-card {
            background: linear-gradient(135deg, #ff8a65, #ff7043);
            border-radius: 18px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease 0.55s both;
            text-decoration: none;
            display: block;
            border: none;
        }

        .points-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .points-card:hover::before,
        .points-card:active::before {
            opacity: 1;
        }

        .points-card:hover,
        .points-card:active {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255,112,67,0.4);
        }

        .points-number {
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }

        .points-desc {
            font-size: 13px;
            color: rgba(255,255,255,0.88);
            font-weight: 500;
        }

        /* 功能网格 */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
            animation: fadeInUp 0.5s ease 0.6s both;
        }

        .feature-item {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 16px 14px;
            transition: all 0.25s ease;
        }

        .feature-item:hover,
        .feature-item:active {
            background: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-name {
            font-size: 15px;
            font-weight: 700;
            color: #e8eaf6;
            margin-bottom: 2px;
        }

        .feature-desc {
            font-size: 12px;
            color: #78909c;
        }

        /* CTA 按钮 */
        .cta-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #ff8a65, #ff7043);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            padding: 16px 24px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            animation: fadeInUp 0.5s ease 0.65s both;
            box-shadow: 0 6px 24px rgba(255,112,67,0.35);
        }

        .cta-btn:hover,
        .cta-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(255,112,67,0.5);
        }

        .fire-icon {
            font-size: 20px;
        }

        /* 底部 */
        footer {
            margin-top: auto;
            padding-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #455a64;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .card { padding: 28px 20px 28px; margin-top: 5%; }
            .main-title h1 { font-size: 23px; }
            .points-number { font-size: 42px; }
            .features-grid { gap: 10px; }
            .feature-item { padding: 14px 12px; }
        }
    </style>
</head>
