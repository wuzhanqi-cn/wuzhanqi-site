<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单位换算器</title>

<style>
  :root {
    --primary: #6366f1;
    --primary-light: #818cf8;
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --success: #22c55e;
    --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* 背景动画 */
  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(34,197,94,0.06) 0%, transparent 50%);
    animation: bgFloat 20s ease-in-out infinite alternate;
    z-index: -1;
  }
  @keyframes bgFloat {
    0% { transform: translate(0,0) rotate(0deg); }
    100% { transform: translate(-2%,2%) rotate(3deg); }
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* 头部 */
  .header {
    text-align: center;
    margin-bottom: 40px;
  }
  .header h1 {
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary-light), var(--success));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .header p {
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  /* 分类标签 */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
  }
  .tab {
    padding: 8px 18px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab:hover {
    border-color: var(--primary);
    color: var(--primary-light);
    background: rgba(99,102,241,0.08);
  }
  .tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 2px 12px rgba(99,102,241,0.3);
  }

  /* 换算卡片 */
  .converter-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    transition: transform 0.2s;
  }
  .converter-card:hover {
    transform: translateY(-1px);
  }

  .input-group {
    display: flex;
    align-items: stretch;
    gap: 0;
    margin-bottom: 20px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1.5px solid var(--border);
    transition: border-color 0.25s;
  }
  .input-group:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
  }
  .input-group input {
    flex: 1;
    padding: 16px 20px;
    font-size: 1.3rem;
    background: var(--bg);
    color: var(--text);
    border: none;
    outline: none;
    font-family: inherit;
    min-width: 0;
  }
  .input-group input::placeholder {
    color: var(--text-muted);
    font-size: 1rem;
  }
  .input-group select {
    padding: 16px;
    font-size: 1rem;
    background: var(--card);
    color: var(--text);
    border: none;
    border-left: 1px solid var(--border);
    outline: none;
    cursor: pointer;
    font-family: inherit;
    min-width: 100px;
  }

  /* 交换按钮 */
  .swap-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 8px 0;
  }
  .swap-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--primary-light);
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .swap-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    transform: rotate(180deg);
  }

  /* 结果区域 */
  .result-area {
    margin-top: 24px;
    padding: 24px;
    background: var(--bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    min-height: 60px;
  }
  .result-main {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--success);
    word-break: break-all;
    margin-bottom: 12px;
  }
  .result-formula {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  /* 快捷参考表 */
  .ref-table {
    margin-top: 28px;
    width: 100%;
    border-collapse: collapse;
  }
  .ref-table th {
    text-align: left;
    padding: 10px 12px;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .ref-table td {
    padding: 10px 12px;
    font-size: 0.9rem;
    border-bottom: 1px solid rgba(51,65,85,0.5);
  }
  .ref-table tr:hover td {
    background: rgba(99,102,241,0.05);
  }
  .ref-table .val {
    color: var(--primary-light);
    font-weight: 600;
    cursor: pointer;
  }
  .ref-table .val:hover {
    text-decoration: underline;
  }

  /* 历史记录 */
  .history-section {
    margin-top: 32px;
  }
  .history-title {
    font-size: 1rem;
    color: var(--text-muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .clear-btn {
    font-size: 0.8rem;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .clear-btn:hover {
    color: #f87171;
    background: rgba(248,113,113,0.1);
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history-item {
    padding: 10px 14px;
    background: var(--card);
    border-radius: 8px;
    font-size: 0.88rem;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .history-item:hover {
    border-color: var(--primary);
    color: var(--text);
  }

  /* 响应式 */
  @media (max-width: 600px) {
    .container { padding: 24px 12px; }
    .header h1 { font-size: 1.6rem; }
    .converter-card { padding: 20px; }
    .input-group input { font-size: 1.1rem; padding: 14px; }
    .result-main { font-size: 1.3rem; }
  }
</style>

    name: '密度', icon: '🧱',
    units: {
      'kgm3':   { name: '千克/米³',          factor: 1 },
      'gL':     { name: '克/升(g/L)',        factor: 1 },
      'kgL':    { name: '千克/升(kg/L)',     factor: 1000 },
      'gcm3':   { name: '克/厘米³(g/cm³)',   factor: 1000 },
      'lbft3':  { name: '磅/英尺³',         factor: 16.018463 },
      'lbin3':  { name: '磅/英寸³',         factor: 27679.90471 },
    }
  }
};

// ====== 温度换算 ======
function convertTemperature(val, from, to) {
  if (from === to) return val;
  let c;
  switch(from) {
    case 'C': c = val; break;
    case 'F': c = (val - 32) * 5/9; break;
    case 'K': c = val - 273.15; break;
    case 'Re': c = val * 5/4; break;
    case 'Ra': c = (val - 491.67) * 5/9; break;
  }
  switch(to) {
    case 'C': return c;
    case 'F': return c * 9/5 + 32;
    case 'K': return c + 273.15;
    case 'Re': return c * 4/5;
    case 'Ra': return c * 9/5 + 491.67;
  }
}

// ====== 油耗换算 ======
function convertFuel(val, from, to) {
  if (from === to) return val;
  let l100;
  switch(from) {
    case 'L100km': l100 = val; break;
    case 'kmL': l100 = 100 / val; break;
    case 'mpgUS': l100 = 235.215 / val; break;
    case 'mpgUK': l100 = 282.481 / val; break;
  }
  switch(to) {
    case 'L100km': return l100;
    case 'kmL': return 100 / l100;
    case 'mpgUS': return 235.215 / l100;
    case 'mpgUK': return 282.481 / l100;
  }
}

// ====== 电耗换算 ======
// 基准单位：kWh/100km
// 1 L汽油 ≈ 8.89 kWh（热值折算）
const KWH_PER_LITER_GASOLINE = 8.89;
const KM_PER_MILE = 1.609344;

function convertEConsumption(val, from, to) {
  if (from === to) return val;
  // 统一转到 kWh/100km
  let kwh100;
  switch(from) {
    case 'kWh100km': kwh100 = val; break;
    case 'kmkWh':     kwh100 = 100 / val; break;              // km/kWh → kWh/100km
    case 'Whkm':      kwh100 = val / 10; break;               // Wh/km → kWh/100km (÷10)
    case 'mikWh':     kwh100 = 100 / (val * KM_PER_MILE); break; // mi/kWh → kWh/100km
    case 'kWhmi':     kwh100 = val * KM_PER_MILE; break; // kWh/mi → kWh/100km (×1.609344)
    case 'Le100km':   kwh100 = val * KWH_PER_LITER_GASOLINE; break; // L油当量 → kWh/100km
  }
  // 从 kWh/100km 转到目标
  switch(to) {
    case 'kWh100km': return kwh100;
    case 'kmkWh':     return 100 / kwh100;
    case 'Whkm':      return kwh100 * 10;
    case 'mikWh':     return 100 / (kwh100 / KM_PER_MILE);
    case 'kWhmi':     return kwh100 / KM_PER_MILE;
    case 'Le100km':   return kwh100 / KWH_PER_LITER_GASOLINE;
  }
}

// ====== 核心换算 ======
function convert(val, from, to, cat) {
  if (isNaN(val) || val === '') return '';
  const catData = categories[cat];
  if (catData.custom) {
    if (cat === 'temperature') return convertTemperature(val, from, to);
    if (cat === 'fuel') return convertFuel(val, from, to);
    if (cat === 'econsumption') return convertEConsumption(val, from, to);
  }
  const fromFactor = catData.units[from].factor;
  const toFactor = catData.units[to].factor;
  return val * fromFactor / toFactor;
}

// ====== 格式化数字 ======
function formatNum(n) {
  if (n === '' || n === undefined) return '';
  const num = parseFloat(n);
  if (isNaN(num)) return n;
  if (Math.abs(num) >= 1e15 || (Math.abs(num) < 1e-10 && num !== 0)) {
    return num.toExponential(6);
  }
  const s = num.toPrecision(10);
  return parseFloat(s).toString();
}

// ====== 状态 ======
let currentCat = 'length';
let history = JSON.parse(localStorage.getItem('convHistory') || '[]');

// ====== DOM ======
const $tabs = document.getElementById('tabs');
const $input = document.getElementById('inputValue');
const $output = document.getElementById('outputValue');
const $from = document.getElementById('fromUnit');
const $to = document.getElementById('toUnit');
const $swap = document.getElementById('swapBtn');
const $resultArea = document.getElementById('resultArea');
const $resultMain = document.getElementById('resultMain');
const $resultFormula = document.getElementById('resultFormula');
const $refTable = document.getElementById('refTable');
const $refBody = document.getElementById('refBody');
const $histSec = document.getElementById('historySection');
const $histList = document.getElementById('historyList');
const $clearHist = document.getElementById('clearHistory');

// ====== 渲染标签 ======
function renderTabs() {
  $tabs.innerHTML = '';
  for (const [key, cat] of Object.entries(categories)) {
    const btn = document.createElement('button');
    btn.className = 'tab' + (key === currentCat ? ' active' : '');
    btn.innerHTML = `${cat.icon} ${cat.name}`;
    btn.onclick = () => { currentCat = key; renderTabs(); renderSelects(); doConvert(); };
    $tabs.appendChild(btn);
  }
}

// ====== 渲染下拉 ======
function renderSelects() {
  const units = categories[currentCat].units;
  const keys = Object.keys(units);
  $from.innerHTML = '';
  $to.innerHTML = '';
  keys.forEach((k, i) => {
    const o1 = new Option(units[k].name, k);
    const o2 = new Option(units[k].name, k);
    $from.add(o1);
    $to.add(o2);
  });
  $from.value = keys[0];
  $to.value = keys.length > 1 ? keys[1] : keys[0];
}

// ====== 换算执行 ======
function doConvert() {
  const val = parseFloat($input.value);
  if (isNaN(val) || $input.value === '') {
    $output.value = '';
    $resultArea.style.display = 'none';
    $refTable.style.display = 'none';
    return;
  }
  const from = $from.value;
  const to = $to.value;
  const result = convert(val, from, to, currentCat);
  $output.value = formatNum(result);

  $resultArea.style.display = 'block';
  const fromName = categories[currentCat].units[from].name;
  const toName = categories[currentCat].units[to].name;
  $resultMain.textContent = `${val} ${fromName} = ${formatNum(result)} ${toName}`;
  $resultFormula.textContent = `1 ${fromName} = ${formatNum(convert(1, from, to, currentCat))} ${toName}`;

  renderRefTable(val, from);
  addHistory(val, fromName, formatNum(result), toName);
}

// ====== 参考表 ======
function renderRefTable(val, from) {
  const units = categories[currentCat].units;
  const keys = Object.keys(units);
  if (keys.length <= 2) { $refTable.style.display = 'none'; return; }
  $refTable.style.display = 'table';
  $refBody.innerHTML = '';
  const common = keys.filter(k => k !== from).slice(0, 6);
  common.forEach(k => {
    const r = convert(val, from, k, currentCat);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>1 ${units[from].name}</td><td class="val" data-unit="${k}">${formatNum(convert(1, from, k, currentCat))} ${units[k].name}</td>`;
    $refBody.appendChild(tr);
  });
  $refBody.querySelectorAll('.val').forEach(el => {
    el.onclick = () => {
      $to.value = el.dataset.unit;
      doConvert();
    };
  });
}

// ====== 历史 ======
function addHistory(val, fromName, result, toName) {
  const entry = `${val} ${fromName} → ${result} ${toName}`;
  history = history.filter(h => h !== entry);
  history.unshift(entry);
  if (history.length > 20) history.pop();
  localStorage.setItem('convHistory', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  if (history.length === 0) { $histSec.style.display = 'none'; return; }
  $histSec.style.display = 'block';
  $histList.innerHTML = '';
  history.slice(0, 8).forEach(h => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.textContent = h;
    $histList.appendChild(div);
  });
}

$clearHist.onclick = () => {
  history = [];
  localStorage.removeItem('convHistory');
  renderHistory();
};

// ====== 交换 ======
$swap.onclick = () => {
  const tmp = $from.value;
  $from.value = $to.value;
  $to.value = tmp;
  doConvert();
};

// ====== 事件 ======
$input.addEventListener('input', doConvert);
$from.addEventListener('change', doConvert);
$to.addEventListener('change', doConvert);

document.addEventListener('keydown', e => {
  if (e.key === 'Tab' && !e.shiftKey && document.activeElement === $input) {}
});

// ====== 初始化 ======
renderTabs();
renderSelects();
renderHistory();
doConvert();
</script>
