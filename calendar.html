<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻日历 - wuzhanqi.cn</title>
    <meta name="description" content="wuzhanqi.cn 新闻日历，按月份浏览新闻">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.18);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        
        .back-link:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .all-news-link {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.18);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        
        .all-news-link:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
        }
        
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.6s ease 0.1s backwards;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            opacity: 0.8;
            font-size: 1rem;
        }
        
        .calendar-intro {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.8;
            font-size: 1rem;
            animation: fadeInDown 0.6s ease 0.15s backwards;
        }
        
        .year-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
            animation: fadeInUp 0.6s ease 0.2s backwards;
        }
        
        .month-card {
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: block;
            color: #fff;
        }
        
        .month-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .month-card:hover::before {
            opacity: 1;
        }
        
        .month-card:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            border-color: rgba(255,255,255,0.4);
        }
        
        .month-card.has-news {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.4);
        }
        
        .month-card.has-news::after {
            content: '';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
        }
        
        .month-card.no-news {
            opacity: 0.4;
            cursor: default;
        }
        
        .month-card.no-news:hover {
            transform: none;
            box-shadow: none;
            background: rgba(255,255,255,0.12);
        }
        
        .month-number {
            font-size: 2.5rem;
            font-weight: 700;
            opacity: 0.3;
            margin-bottom: 0.3rem;
        }
        
        .month-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .month-count {
            font-size: 0.85rem;
            opacity: 0.7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }
        
        .month-card.no-news .month-count {
            opacity: 0.5;
        }
        
        footer {
            text-align: center;
            padding: 2rem 0;
            font-size: 0.85rem;
            opacity: 0.6;
            margin-top: 3rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem 1rem;
            opacity: 0.8;
            font-size: 1.1rem;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 700px) {
            .year-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
            }
            
            .month-number {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 500px) {
            .year-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .month-number {
                font-size: 1.8rem;
            }
            
            .month-card {
                padding: 1.2rem 0.8rem;
            }
            
            .nav-bar {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            
            .back-link, .all-news-link {
                text-align: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="/" class="back-link">← 返回首页</a>
            <a href="/news.html" class="all-news-link">📰 全部新闻</a>
        </div>
        
        <div class="header">
            <h1>📅 新闻日历</h1>
            <p>点击月份，查看该月新闻</p>
        </div>
        
        <div class="calendar-intro" id="calendarIntro">
            加载中
        </div>
        
        <div class="year-grid" id="yearGrid">
            <div class="loading">加载中</div>
        </div>
        
        <footer>© 2026 wuzhanqi.cn | 每日22:00更新</footer>
    </div>
    
    <script>
        const MONTH_NAMES = [
            '一月', '二月', '三月', '四月', '五月', '六月',
            '七月', '八月', '九月', '十月', '十一月', '十二月'
        ];
        
        async function loadCalendar() {
            const yearGrid = document.getElementById('yearGrid');
            const calendarIntro = document.getElementById('calendarIntro');
            
            try {
                const response = await fetch('/news.json?t=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const _rawNews = await response.json();
                // 兼容两种数据格式：纯数组，或 { lastUpdate, source, news: [...] } 对象
                const newsData = Array.isArray(_rawNews) ? _rawNews : (_rawNews.news || []);
                
                // 统计每月新闻数量
                const monthCount = {};
                const currentYear = new Date().getFullYear();
                
                newsData.forEach(news => {
                    const date = new Date(news.date + 'T00:00:00');
                    const year = date.getFullYear();
                    const month = date.getMonth() + 1;
                    
                    if (!monthCount[year]) {
                        monthCount[year] = {};
                    }
                    if (!monthCount[year][month]) {
                        monthCount[year][month] = 0;
                    }
                    monthCount[year][month]++;
                });
                
                // 计算年份和总新闻数
                const years = Object.keys(monthCount).sort((a, b) => b - a);
                let totalNews = 0;
                years.forEach(year => {
                    Object.values(monthCount[year]).forEach(count => {
                        totalNews += count;
                    });
                });
                
                // 显示概览
                const yearList = years.join('、');
                calendarIntro.textContent = `共 ${totalNews} 条新闻 | 覆盖 ${years.length} 年: ${yearList}`;
                
                // 生成月份卡片
                let html = '';
                years.forEach(year => {
                    // 年份标题
                    html += `<div style="grid-column: 1 / -1; text-align: center; margin-top: 1rem; font-size: 1.5rem; font-weight: 700; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">${year} 年</div>`;
                    
                    // 月份卡片
                    for (let month = 1; month <= 12; month++) {
                        const count = monthCount[year]?.[month] || 0;
                        const hasNews = count > 0;
                        
                        html += `
                            <a href="/news.html?year=${year}&month=${month}" 
                               class="month-card ${hasNews ? 'has-news' : 'no-news'}">
                                <div class="month-number">${String(month).padStart(2, '0')}</div>
                                <div class="month-name">${MONTH_NAMES[month - 1]}</div>
                                <div class="month-count">
                                    ${hasNews 
                                        ? `<span>📰</span><span>${count} 条新闻</span>` 
                                        : '<span>暂无新闻</span>'}
                                </div>
                            </a>
                        `;
                    }
                });
                
                yearGrid.innerHTML = html;
                
            } catch (error) {
                console.error('加载失败:', error);
                yearGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 2rem; opacity: 0.8;">
                        加载失败: ${error.message}
                    </div>
                `;
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadCalendar);
    </script>
</body>
</html>
