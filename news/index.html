<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日要闻 - wuzhanqi.cn</title>
    <meta name="description" content="wuzhanqi.cn 每日要闻更新">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .nav-links {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        
        .back-link, .calendar-link {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.18);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        
        .back-link:hover, .calendar-link:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .refresh-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.18);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        
        .refresh-btn:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease 0.1s backwards;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            opacity: 0.8;
            font-size: 1rem;
        }
        
        .current-filter {
            text-align: center;
            margin-bottom: 1.5rem;
            animation: fadeInDown 0.6s ease 0.15s backwards;
        }
        
        .filter-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            font-size: 0.95rem;
        }
        
        .filter-badge .clear {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .filter-badge .clear:hover {
            opacity: 1;
        }
        
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeInUp 0.6s ease 0.2s backwards;
        }
        
        .news-item {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .news-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .news-title {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.4;
            flex: 1;
        }
        
        .news-date {
            font-size: 0.85rem;
            opacity: 0.7;
            white-space: nowrap;
        }
        
        .news-summary {
            font-size: 0.95rem;
            opacity: 0.85;
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        
        .news-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .tag {
            padding: 4px 12px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        
        .tag:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.1rem;
            opacity: 0.8;
        }
        
        .error {
            text-align: center;
            padding: 3rem;
            background: rgba(255,100,100,0.2);
            border-radius: 16px;
            margin: 2rem 0;
        }
        
        .empty {
            text-align: center;
            padding: 3rem;
            opacity: 0.7;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .news-header {
                flex-direction: column;
            }
            
            .news-date {
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <div class="nav-links">
                <a href="../index.html" class="back-link">← 返回主页</a>
                <a href="../calendar.html" class="calendar-link">📅 日历视图</a>
            </div>
            <button class="refresh-btn" onclick="loadNews()">🔄 刷新</button>
        </div>
        
        <div class="header">
            <h1>📰 每日要闻</h1>
            <p>汇聚每日热点资讯，了解世界动态</p>
        </div>
        
        <div class="current-filter" id="currentFilter" style="display: none;">
            <span class="filter-badge">
                <span id="filterText"></span>
                <span class="clear" onclick="clearFilter()">✕</span>
            </span>
        </div>
        
        <div class="news-list" id="newsList">
            <div class="loading">正在加载新闻...</div>
        </div>
    </div>
    
    <script>
        let allNews = [];
        let currentFilter = null;
        
        // 从URL获取日期参数
        function getDateParam() {
            const params = new URLSearchParams(window.location.search);
            return params.get('date');
        }
        
        // 加载新闻数据
        async function loadNews() {
            const newsList = document.getElementById('newsList');
            newsList.innerHTML = '<div class="loading">正在加载新闻...</div>';
            
            try {
                const response = await fetch('../news.json');
                if (!response.ok) {
                    throw new Error('Failed to load news');
                }
                
                const data = await response.json();
                allNews = data.news || [];
                
                // 检查是否有日期过滤
                const dateParam = getDateParam();
                if (dateParam) {
                    currentFilter = dateParam;
                    document.getElementById('currentFilter').style.display = 'block';
                    document.getElementById('filterText').textContent = `日期: ${dateParam}`;
                }
                
                renderNews();
            } catch (error) {
                newsList.innerHTML = `
                    <div class="error">
                        <p>加载新闻失败</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">${error.message}</p>
                    </div>
                `;
            }
        }
        
        // 渲染新闻列表
        function renderNews() {
            const newsList = document.getElementById('newsList');
            
            let filteredNews = allNews;
            
            // 应用日期过滤
            if (currentFilter) {
                filteredNews = allNews.filter(item => item.date === currentFilter);
            }
            
            // 按日期排序（最新的在前）
            filteredNews.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            if (filteredNews.length === 0) {
                newsList.innerHTML = '<div class="empty">暂无新闻</div>';
                return;
            }
            
            newsList.innerHTML = filteredNews.map(item => `
                <div class="news-item" onclick="showDetail('${item.id}')">
                    <div class="news-header">
                        <div class="news-title">${escapeHtml(item.title)}</div>
                        <div class="news-date">${formatDate(item.date)}</div>
                    </div>
                    <div class="news-summary">${escapeHtml(item.summary)}</div>
                    <div class="news-tags">
                        ${(item.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }
        
        // 清除过滤
        function clearFilter() {
            currentFilter = null;
            document.getElementById('currentFilter').style.display = 'none';
            
            // 清除URL参数
            const url = new URL(window.location);
            url.searchParams.delete('date');
            window.history.replaceState({}, '', url);
            
            renderNews();
        }
        
        // 显示详情（可扩展）
        function showDetail(id) {
            const item = allNews.find(n => n.id === id);
            if (item && item.url) {
                window.open(item.url, '_blank');
            }
        }
        
        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
        
        // HTML转义
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 页面加载时自动加载新闻
        loadNews();
    </script>
</body>
</html>
