var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0,0,10);
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
scene.add(new THREE.AmbientLight(0xffffff,0.6));
var keyL=new THREE.DirectionalLight(0xffffff,1.0);keyL.position.set(4,6,8);scene.add(keyL);
var rimL=new THREE.DirectionalLight(0xa8c8ff,0.45);rimL.position.set(-6,2,-4);scene.add(rimL);
var fillL=new THREE.DirectionalLight(0xffe6c0,0.35);fillL.position.set(0,-4,6);scene.add(fillL);
function makeShadowTex(){
  var cv=document.createElement('canvas');cv.width=cv.height=256;
  var g=cv.getContext('2d');
  var grd=g.createRadialGradient(128,128,0,128,128,128);
  grd.addColorStop(0,'rgba(0,0,0,0.55)');
  grd.addColorStop(0.5,'rgba(0,0,0,0.18)');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd;g.fillRect(0,0,256,256);
  var t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t;
}
var SHADOW=makeShadowTex();
var loader=new THREE.TextureLoader();
function loadTex(u){var t=loader.load(u);t.encoding=THREE.sRGBEncoding;return t;}
function makeNote(f,b){
  var g=new THREE.Group();
  var fm=loadTex(f);var bm=loadTex(b);
  var edge=new THREE.MeshStandardMaterial({color:0xd4c47a,roughness:0.9,metalness:0.05});
  var fMat=new THREE.MeshStandardMaterial({map:fm,roughness:0.65,metalness:0});
  var bMat=new THREE.MeshStandardMaterial({map:bm,roughness:0.65,metalness:0});
  var geo=new THREE.BoxGeometry(3.8,1.9,0.06);
  var mesh=new THREE.Mesh(geo,[edge,edge,edge,edge,fMat,bMat]);
  g.add(mesh);return g;
}
var note=makeNote(TEX_FRONT,TEX_BACK);
note.rotation.x=-0.12;
scene.add(note);
var shadow=new THREE.Mesh(new THREE.PlaneGeometry(5,3),
  new THREE.MeshBasicMaterial({map:SHADOW,transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.set(0,-1.15,-0.3);scene.add(shadow);
var isDragging=false,px=0,py=0,autoRotate=false;
var targetRotY=0,targetRotX=-0.12;
function getXY(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};}
function down(e){isDragging=true;var p=getXY(e);px=p.x;py=p.y;}
function move(e){
  if(!isDragging)return;
  var p=getXY(e);
  note.rotation.y+=(p.x-px)*0.015;
  note.rotation.x+=(p.y-py)*0.015;
  note.rotation.x=Math.max(-1.3,Math.min(1.3,note.rotation.x));
  px=p.x;py=p.y;
}
function up(){isDragging=false;}
var cv=renderer.domElement;
cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:true});
cv.addEventListener('touchmove',move,{passive:false});
cv.addEventListener('touchend',up);
cv.addEventListener('wheel',function(e){
  camera.position.z=Math.max(5,Math.min(18,camera.position.z+e.deltaY*0.015));
},{passive:true});
addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
window.resetView=function(){
  note.rotation.set(-0.12,0,0);
  camera.position.z=10;
};
window.toggleAuto=function(){
  autoRotate=!autoRotate;
};
function loop(){
  requestAnimationFrame(loop);
  if(autoRotate&&!isDragging)note.rotation.y+=0.008;
  renderer.render(scene,camera);
}
loop();
})();
</script>
